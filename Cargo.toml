[package]
name = "chronicle"
version = "0.1.0"
edition = "2021"
description = "Event-sourced RPG Campaign GM Engine with SQLite Knowledge Graph, FTS5 Lorebook, MCP Server, CLI, and Auto-Compiled Referencable Markdown Documents."

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
rand = "0.8"
rusqlite = { version = "0.32", features = ["bundled", "serde_json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
